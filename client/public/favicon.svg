<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="3"/>
      <feFlood flood-color="#818cf8" flood-opacity="0.5"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark bg -->
  <rect width="100" height="100" rx="22" fill="#0c0c14"/>
  <!-- Ambient orb -->
  <circle cx="50" cy="45" r="38" fill="url(#c)" opacity="0.4"/>
  <!-- Stylized "W" letterform -->
  <g filter="url(#g)">
    <path d="M22 28 L32 72 L44 45 L50 58 L56 45 L68 72 L78 28" fill="none" stroke="url(#a)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Accent dot -->
  <circle cx="50" cy="80" r="4" fill="url(#b)"/>
</svg>
