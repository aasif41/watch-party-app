<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#60a5fa" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Blue bg -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <!-- Ambient blue orb -->
  <circle cx="50" cy="42" r="36" fill="#3b82f6" opacity="0.1"/>
  <circle cx="50" cy="46" r="24" fill="#60a5fa" opacity="0.06"/>
  <!-- Stylized "W" with blue glow -->
  <g filter="url(#outerGlow)">
    <g filter="url(#glow)">
      <path d="M22 28 L32 72 L44 44 L50 58 L56 44 L68 72 L78 28" fill="none" stroke="url(#wGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Accent dot -->
  <circle cx="50" cy="80" r="4" fill="#93c5fd"/>
  <!-- Sparkles -->
  <circle cx="26" cy="22" r="1.5" fill="#93c5fd" opacity="0.5"/>
  <circle cx="74" cy="22" r="1.5" fill="#93c5fd" opacity="0.5"/>
</svg>
