<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feFlood flood-color="#a78bfa" flood-opacity="0.7"/>
      <feComposite in2="blur1" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <line x1="25" y1="3" x2="25" y2="97" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="50" y1="3" x2="50" y2="97" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="75" y1="3" x2="75" y2="97" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="3" y1="25" x2="97" y2="25" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="3" y1="50" x2="97" y2="50" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="3" y1="75" x2="97" y2="75" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>

  <!-- Floating particles -->
  <circle cx="20" cy="22" r="1.5" fill="#818cf8" opacity="0.5"/>
  <circle cx="80" cy="18" r="1" fill="#f472b6" opacity="0.4"/>
  <circle cx="15" cy="78" r="1.2" fill="#c084fc" opacity="0.3"/>
  <circle cx="82" cy="75" r="1.8" fill="#818cf8" opacity="0.4"/>

  <!-- Neon ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#ringGrad)" stroke-width="5" filter="url(#neonGlow)" opacity="0.9"/>

  <!-- Inner circle bg -->
  <circle cx="50" cy="50" r="26" fill="rgba(15,23,42,0.8)"/>

  <!-- Play triangle -->
  <path d="M42 35 L68 50 L42 65 Z" fill="url(#playGrad)" filter="url(#innerShadow)" opacity="0.95"/>

  <!-- W and P letters (subtle branding) -->
  <text x="50" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="rgba(255,255,255,0.15)" letter-spacing="4">WP</text>
</svg>
