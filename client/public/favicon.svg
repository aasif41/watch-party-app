<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect x="5" y="5" width="90" height="90" rx="25" fill="#0C0C0C" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Glowing Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#primaryGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Glass Center Play Button -->
  <path d="M42 34 L70 50 L42 66 Z" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linejoin="round" />
</svg>
